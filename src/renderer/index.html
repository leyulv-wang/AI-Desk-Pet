<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'"
  />
  <title>桌宠</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 桌宠本体。整窗透明，只有 .interactive 元素会接收鼠标 -->
  <canvas id="pet-canvas"></canvas>

  <!-- 一个按需展开的面板，三种视图不互相覆盖。 -->
  <section id="companion-panel" class="interactive" aria-label="陪伴面板" hidden>
    <header id="history-header">
      <span class="dot" id="status-dot"></span>
      <span id="chat-title">芙宁娜</span>
      <span id="chat-badge" hidden></span>
      <span class="spacer"></span>
      <button id="btn-close-history" class="icon-btn" aria-label="收起面板" title="收起面板">×</button>
    </header>
    <nav id="panel-tabs" role="tablist" aria-label="面板内容">
      <button id="tab-chat" role="tab" aria-selected="true" aria-controls="history-panel">聊天</button>
      <button id="tab-memory" role="tab" aria-selected="false" aria-controls="memory-view" tabindex="-1">记忆 <b id="mem-count"></b></button>
      <button id="tab-sing" role="tab" aria-selected="false" aria-controls="sing-panel" tabindex="-1">唱歌</button>
    </nav>
  <section id="history-panel" role="tabpanel" aria-labelledby="tab-chat">
    <div class="pane-toolbar"><span>我们的对话</span><button id="btn-clear" title="清空对话记录（不影响长期记忆）">清空对话</button></div>
    <p id="chat-empty" class="empty-hint">想聊点什么？从下面发来第一句话吧。</p>
    <div id="chat-log"></div>
  </section>
  <section id="memory-view" role="tabpanel" aria-labelledby="tab-memory" hidden><div id="memory-body"></div></section>
  <section id="sing-panel" role="tabpanel" aria-labelledby="tab-sing" hidden>
    <header id="sing-header">
      <span id="sing-title">音乐时光</span>
      <span id="sing-sub" class="sing-sub"></span>
      <span class="spacer"></span>
      <button id="btn-close-sing" class="icon-btn" title="收起面板" aria-label="收起面板">×</button>
    </header>
    <div id="sing-body"></div>
  </section>
  </section>

  <!-- 字幕：只显示最近一轮，回复在这里流式出现 -->
  <div id="subtitle">
    <div id="sub-me" class="sub-line me"></div>
    <div id="sub-pet" class="sub-line pet"></div>
  </div>

  <div id="activity-status" role="status" aria-live="polite" hidden></div>
  <!-- 常用操作留在输入条，低频操作收进更多菜单。 -->
  <form id="input-bar" class="interactive" autocomplete="off">
    <span id="drag-handle" title="按住拖动窗口">⠿</span>
    <button type="button" id="btn-history" class="icon-btn" aria-label="打开聊天面板" aria-expanded="false" aria-controls="companion-panel" title="聊天面板">☰</button>
    <input id="input-text" type="text" placeholder="和我说点什么…" aria-label="发送给桌宠的消息" />
    <button id="btn-send" type="submit">发送</button>
    <button id="btn-stop" type="button" hidden>停止</button>
    <button type="button" id="btn-voice" class="icon-btn" aria-label="语音开关" title="语音开关">🔇</button>
    <details id="more-menu">
      <summary class="icon-btn" aria-label="更多操作" title="更多操作">⋯</summary>
      <div class="more-actions">
        <button type="button" id="btn-memory">记忆</button>
        <button type="button" id="btn-sing">唱歌</button>
        <button type="button" id="btn-config">设置</button>
        <button type="button" id="btn-collapse">安静陪伴</button>
        <button type="button" id="btn-hide" title="Ctrl+Shift+P 恢复">隐藏桌宠</button>
        <button type="button" id="btn-quit" title="Ctrl+Shift+Q">退出</button>
      </div>
    </details>
  </form>

  <!-- 收起后常驻的展开按钮（否则「收起」会把按钮本身也藏掉，没法还原） -->
  <button id="btn-expand" class="interactive" hidden title="展开输入区">聊一聊</button>

  <button id="btn-quiet-stop" class="interactive" hidden title="停止回复或播放">停止</button>

  <div id="zoom-toast"></div>

  <div id="error-overlay" hidden>
    <h2>资源还没准备好</h2>
    <p id="error-detail"></p>
    <pre>npm run setup</pre>
  </div>

  <script src="../../vendor/pixi.min.js"></script>
  <!-- 必须紧跟在 pixi.js 之后：它把 Pixi 里用 new Function() 编译着色器的那段
       换成查表实现，这样严格 CSP（禁止 unsafe-eval）下也能跑 -->
  <script src="../../vendor/unsafe-eval.min.js"></script>
  <script src="../../vendor/live2dcubismcore.min.js"></script>
  <script src="../../vendor/cubism4.min.js"></script>
  <script src="face.js"></script>
  <script src="voice.js"></script>
  <!-- 静态立绘渲染器：只定义 window.petStatic 工厂，**不自动跑**。
       真正决定用哪个渲染器的是 pet.js 的 load()（读 ?renderer= 或 models/index.json）。
       必须排在 pet.js 之前，否则 pet.js 拿不到这个工厂。 -->
  <script src="static-pet.js"></script>
  <script src="pet.js"></script>
  <script src="panels.js"></script>
  <script src="singing.js"></script>
  <script src="chat.js"></script>
</body>
</html>
